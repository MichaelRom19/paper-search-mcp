name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v4
        with:
          version: '0.11.32'
      - name: Install locked build dependencies
        run: uv sync --locked --extra dev
      - name: Build package
        run: uv build --no-build-isolation
      - name: Verify wheel entry points
        run: |
          uv run --locked python -c "import pathlib, zipfile; wheel = next(pathlib.Path('dist').glob('paper_search_mcp-*.whl')); z = zipfile.ZipFile(wheel); entry = next(name for name in z.namelist() if name.endswith('.dist-info/entry_points.txt')); data = z.read(entry).decode(); assert 'paper-search-mcp = paper_search_mcp.server:main' in data; assert 'paper-search = paper_search_mcp.cli:main' in data; print(data)"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
